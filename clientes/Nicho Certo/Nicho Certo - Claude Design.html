document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:'Playfair Display',serif; font-weight:500; font-size:clamp(30px,4.2vw,52px); line-height:1.08; letter-spacing:-0.5px; margin:0 0 24px;\">A demanda existe.<br><em style=\"font-style:italic; color:#9BA7A3;\">O que falta é a operação.<\u002Fem><\u002Fh2>\n      <p style=\"font-size:17px; line-height:1.62; color:#9BA7A3; max-width:440px; margin:0;\">Por que a maioria dos advogados que olha para esse nicho desiste antes de começar a faturar? Três obstáculos concretos — e que esse sistema resolve.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"flex:1 1 440px; min-width:300px; display:flex; flex-direction:column;\">\n      <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .6s ease-out, transform .6s ease-out; display:flex; gap:clamp(24px,4vw,56px); padding:6px 0 30px;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:2px; color:#B7793E; flex:none; padding-top:6px;\">01<\u002Fdiv>\n        <div>\n          <h3 style=\"font-family:'Playfair Display',serif; font-weight:500; font-size:clamp(22px,2.6vw,28px); margin:0 0 12px;\">Montar do zero leva meses<\u002Fh3>\n          <p style=\"font-size:15px; line-height:1.62; color:#9BA7A3; margin:0;\">Site, funil, conteúdo, triagem, estudo da tese. Enquanto você monta, o concorrente já está atendendo o cliente que era seu.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height:1px; background:#24383A;\"><\u002Fdiv>\n      <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .6s ease-out .1s, transform .6s ease-out .1s; display:flex; gap:clamp(24px,4vw,56px); padding:30px 0;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:2px; color:#B7793E; flex:none; padding-top:6px;\">02<\u002Fdiv>\n        <div>\n          <h3 style=\"font-family:'Playfair Display',serif; font-weight:500; font-size:clamp(22px,2.6vw,28px); margin:0 0 12px;\">O erro de OAB custa caro< ut; margin-bottom:46px;\">\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12.5px; letter-spacing:2.5px; color:#B7793E; margin-bottom:20px;\">ANTES DE FALAR COM A GENTE<\u002Fdiv>\n      <h2 style=\"font-family:'Playfair Display',serif; font-weight:500; font-size:clamp(28px,3.8vw,46px); line-height:1.1; letter-spacing:-0.5px; margin:0;\">Perguntas <em style=\"font-style:italic; color:#D6B06A;\">frequentes<\u002Fem>.<\u002Fh2>\n    <\u002Fdiv>\n\n    <div data-reveal=\"\" style=\"opacity:0; transform:translateY(20px); transition:opacity .6s ease-out, transform .6s ease-out; display:flex; flex-direction:column; gap:12px;\">\n\n      <div data-faq=\"\" style=\"background:#122430; border:1px solid #24383A; border-radius:14px; overflow:hidden; transition:border-color .3s ease;\">\n        <button data-faq-q=\"\" type=\"button\" onclick=\"{{ toggleFaq }}\" style=\"all:unset; box-sizing:border-box; cursor:pointer; width:100%; display:flex; align-items:center; justify-content:space-between; gap:18px; padding:22px 24px; font-family:'Montserrat',sans-serif; font-size:17px; font-weight:500; color:#F0ECE3;\">\n          <span>\"Não dá pra eu montar isso sozinho?\"<\u002Fspan>\n          <span data-faq-icon=\"\" style=\"flex:none; font-family:'IBM Plex Mono',monospace; font-size:22px; color:#B7793E; transition:transform .3s ease; line-height:1;\">+<\u002Fspan>\n        <\u002Fbutton>\n        <div data-faq-a=\"\" style=\"display:grid; grid-template-rows:0fr; transition:grid-template-rows .35s ease;\">\n          <div style=\"overflow:hidden;\"><p style=\"margin:0; padding:0 24px 24px; font-size:15px; line-height:1.65; color:#9BA7A3;\">Dá — em alguns meses, dividindo sua atenção entre clientes e ferramentas que você nunca usou. Enquanto você monta, <strong style=\"color:#B8C2BE; font-weight:600;\">quem já está no ar atende o cliente que seria seu<\u002Fstrong>. Seu tempo vale advocacia, não configuração de funil.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-faq=\"\" style=\"background:#122430; border:1px solid #24383A; border-radius:14px; overflow:hidden; transition:border-color .3s ease;\">\n        <button data-faq-q=\"\" type=\"button\" onclick=\"{{ toggleFaq }}\" style=\"all:unset; box-sizing:border-box; cursor:pointer; width:100%; display:flex; align-items:center; justify-content:space-between; gap:18px; padding:22px 24px; font-family:'Montserrat',sans-serif; font-size:17px; font-weight:500; color:#F0ECE3;\">\n          <span>\"Isso é captação? Vou me expor na OAB?\"<\u002Fspan>\n          <span data-faq-icon=\"\" style=\"flex:none; font-family:'IBM Plex Mono',monospace; font-size:22px; color:#B7793E; transition:transform .3s ease; line-height:1;\">+<\u002Fspan>\n        <\u002Fbutton>\n        <div data-faq-a=\"\" style=\"display:grid; grid-template-rows:0fr; transition:grid-template-rows .35s ease;\">\n          <div style=\"overflow:hidden;\"><p style=\"margin:0; padding:0 24px 24px; font-size:15px; line-height:1.65; color:#9BA7A3;\">Não. Publicidade passiva e conteúdo informativo, dentro do Provimento 205/2021. O risco mora no <strong style=\"color:#B8C2BE; font-weight:600;\">\"recupere seu dinheiro\" do concorrente<\u002Fstrong> — não aqui. A blindagem de cada ponto de contato (anúncio, LP, WhatsApp) já vem montada.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-faq=\"\" style=\"background:#122430; border:1px solid #24383A; border-radius:14px; overflow:hidden; transition:border-color .3s ease;\">\n        <button data-faq-q=\"\" type=\"button\" onclick=\"{{ toggleFaq }}\" style=\"all:unset; box-sizing:border-box; cursor:pointer; width:100%; display:flex; align-items:center; justify-content:space-between; gap:18px; padding:22px 24px; font-family:'Montserrat',sans-serif; font-size:17px; font-weight:500; color:#F0ECE3;\">\n          <span>\"Vocês ficam com parte dos meus honorários?\"<\u002Fspan>\n          <span data-faq-icon=\"\" style=\"flex:none; font-family:'IBM Plex Mono',monospace; font-size:22px; color:#B7793E; transition:transform .3s ease; line-height:1;\">+<\u002Fspan>\n        <\u002Fbutton>\n        <div data-faq-a=\"\" style=\"display:grid; grid-template-rows:0fr; transition:grid-template-rows .35s ease;\">\n          <div style=\"overflow:hidden;\"><p style=\"margin:0; padding:0 24px 24px; font-size:15px; line-height:1.65; color:#9BA7A3;\">Nunca. Nem por cliente, nem por percentual. Você paga <strong style=\"color:#B8C2BE; font-weight:600;\">pelo sistema — produto e serviço<\u002Fstrong>. O que entra do seu cliente é integralmente seu.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-faq=\"\" style=\"background:#122430; border:1px solid #24383A; border-radius:14px; overflow:hidden; transition:border-color .3s ease;\">\n        <button data-faq-q=\"\" type=\"button\" onclick=\"{{ toggleFaq }}\" style=\"all:unset; box-sizing:border-box; cursor:pointer; width:100%; display:flex; align-items:center; justify-content:space-between; gap:18px; padding:22px 24px; font-family:'Montserrat',sans-serif; font-size:17px; font-weight:500; color:#F0ECE3;\">\n          <span>\"O radar é só um PDF que chega todo mês?\"<\u002Fspan>\n          <span data-faq-icon=\"\" style=\"flex:none; font-family:'IBM Plex Mono',monospace; font-size:22px; color:#B7793E; transition:transform .3s ease; line-height:1;\">+<\u002Fspan>\n        <\u002Fbutton>\n        <div data-faq-a=\"\" style=\"display:grid; grid-template-rows:0fr; transition:grid-template-rows .35s ease;\">\n          <div style=\"overflow:hidden;\"><p style=\"margin:0; padding:0 24px 24px; font-size:15px; line-height:1.65; color:#9BA7A3;\">Não. São <strong style=\"color:#B8C2BE; font-weight:600;\">decisões públicas novas toda semana<\u002Fstrong>, filtradas por tribunal, pedido, valor e tese acolhida. No Pro, os alertas chegam recortados pro seu perfil de caso. É o que te mantém à frente — não informado de vez em quando.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-faq=\"\" style=\"background:#122430; border:1px solid #24383A; border-radius:14px; overflow:hidden; transition:border-color .3s ease;\">\n        <button data-faq-q=\"\" type=\"button\" onclick=\"{{ toggleFaq }}\" style=\"all:unset; box-sizing:border-box; cursor:pointer; width:100%; display:flex; align-items:center; justify-content:space-between; gap:18px; padding:22px 24px; font-family:'Montserrat',sans-serif; font-size:17px; font-weight:500; color:#F0ECE3;\">\n          <span>\"A IA vai advogar no meu lugar?\"<\u002Fspan>\n          <span data-faq-icon=\"\" style=\"flex:none; font-family:'IBM Plex Mono',monospace; font-size:22px; color:#B7793E; transition:transform .3s ease; line-height:1;\">+<\u002Fspan>\n        <\u002Fbutton>\n        <div data-faq-a=\"\" style=\"display:grid; grid-template-rows:0fr; transition:grid-template-rows .35s ease;\">\n          <div style=\"overflow:hidden;\"><p style=\"margin:0; padding:0 24px 24px; font-size:15px; line-height:1.65; color:#9BA7A3;\">Não, e nem deveria. Ela organiza extratos, aponta a prova que falta, revisa a <strong style=\"color:#B8C2BE; font-weight:600;\">sua<\u002Fstrong> peça. A tese, a estratégia e a assinatura continuam suas. Quem responde perante a OAB é você.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-faq=\"\" style=\"background:#122430; border:1px solid #24383A; border-radius:14px; overflow:hidden; transition:border-color .3s ease;\">\n        <button data-faq-q=\"\" type=\"button\" onclick=\"{{ toggleFaq }}\" style=\"all:unset; box-sizing:border-box; cursor:pointer; width:100%; display:flex; align-items:center; justify-content:space-between; gap:18px; padding:22px 24px; font-family:'Montserrat',sans-serif; font-size:17px; font-weight:500; color:#F0ECE3;\">\n          <span>\"E se todo mundo entrar nesse nicho?\"<\u002Fspan>\n          <span data-faq-icon=\"\" style=\"flex:none; font-family:'IBM Plex Mono',monospace; font-size:22px; color:#B7793E; transition:transform .3s ease; line-height:1;\">+<\u002Fspan>\n        <\u002Fbutton>\n        <div data-faq-a=\"\" style=\"display:grid; grid-template-rows:0fr; transition:grid-template-rows .35s ease;\">\n          <div style=\"overflow:hidden;\"><p style=\"margin:0; padding:0 24px 24px; font-size:15px; line-height:1.65; color:#9BA7A3;\">Por isso a janela é agora. O STJ ainda não pacificou; <strong style=\"color:#B8C2BE; font-weight:600;\">quem firma autoridade primeiro lidera<\u002Fstrong>. No Pro você trava exclusividade na sua região e não divide o mercado com outro assinante.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CTA FINAL -->\n  <section id=\"cta\" style=\"background:#0A1C1F; border-top:1px solid #24383A;\">\n    <div data-reveal=\"\" style=\"opacity:0; transform:translateY(24px); transition:opacity .7s ease-out, transform .7s ease-out; max-width:820px; margin:0 auto; padding:clamp(80px,10vw,130px) 24px; text-align:center;\">\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12.5px; letter-spacing:2.5px; color:#B7793E; margin-bottom:22px;\">A JANELA É AGORA<\u002Fdiv>\n      <h2 style=\"font-family:'Playfair Display',serif; font-weight:500; font-size:clamp(32px,5vw,56px); line-height:1.1; letter-spacing:-0.5px; margin:0 0 24px;\">O STJ ainda não pacificou. <em style=\"font-style:italic; color:#D6B06A;\">Quem construir autoridade primeiro, lidera.<\u002Fem><\u002Fh2>\n      <p style=\"font-size:18px; line-height:1.6; color:#9BA7A3; max-width:560px; margin:0 auto 36px;\">Entre no nicho com a operação pronta, antes que ele fique saturado.<\u002Fp>\n      <div style=\"display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-bottom:24px;\">\n        <a href=\"#\" style=\"background:#B7793E; color:#071112; text-decoration:none; font-weight:600; font-size:15.5px; padding:15px 30px; border-radius:12px;\" style-hover=\"background:#D6B06A;\">Falar no WhatsApp →<\u002Fa>\n        <a href=\"#planos\" style=\"border:1px solid #24383A; color:#F0ECE3; text-decoration:none; font-weight:500; font-size:15.5px; padding:15px 30px; border-radius:12px;\" style-hover=\"border-color:#B7793E;\">Revisar os planos<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:#9BA7A3; letter-spacing:0.5px;\">Resposta em até 24h · Conversa sem compromisso · Vagas limitadas por região<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer style=\"border-top:1px solid #24383A; background:#071112;\">\n    <div style=\"max-width:1180px; margin:0 auto; padding:clamp(48px,6vw,72px) 24px; display:flex; flex-wrap:wrap; gap:48px;\">\n      <div style=\"flex:2 1 360px; min-width:280px;\">\n        <div style=\"display:flex; align-items:center; gap:9px; font-family:'Playfair Display',serif; font-size:20px; font-weight:600; margin-bottom:16px;\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 40 40\" fill=\"none\" style=\"display:block; flex:none;\"><circle cx=\"20\" cy=\"20\" r=\"18\" stroke=\"#B7793E\" stroke-width=\"1.3\" opacity=\"0.45\"><\u002Fcircle><circle cx=\"20\" cy=\"20\" r=\"11\" stroke=\"#D6B06A\" stroke-width=\"1.3\" opacity=\"0.65\"><\u002Fcircle><circle cx=\"20\" cy=\"20\" r=\"4.5\" stroke=\"#D6B06A\" stroke-width=\"1.3\"><\u002Fcircle><line x1=\"20\" y1=\"1.5\" x2=\"20\" y2=\"38.5\" stroke=\"#24383A\" stroke-width=\"1\"><\u002Fline><line x1=\"1.5\" y1=\"20\" x2=\"38.5\" y2=\"20\" stroke=\"#24383A\" stroke-width=\"1\"><\u002Fline><circle cx=\"30.5\" cy=\"11\" r=\"2.8\" fill=\"#D6B06A\"><\u002Fcircle><\u002Fsvg>Nicho Certo<\u002Fdiv>\n        <p style=\"font-size:14.5px; line-height:1.6; color:#9BA7A3; max-width:420px; margin:0;\">Sistema de aquisição para advogados entrarem no nicho de ludopatia com a operação pronta e dentro das regras da OAB.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 160px; min-width:140px;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:1.5px; color:#B7793E; margin-bottom:18px;\">NAVEGAR<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:11px;\">\n          <a href=\"#sistema\" style=\"color:#9BA7A3; text-decoration:none; font-size:14px;\">O sistema<\u002Fa>\n          <a href=\"#categorias\" style=\"color:#9BA7A3; text-decoration:none; font-size:14px;\">Categorias<\u002Fa>\n          <a href=\"#prova\" style=\"color:#9BA7A3; text-decoration:none; font-size:14px;\">Prova jurídica<\u002Fa>\n          <a href=\"#planos\" style=\"color:#9BA7A3; text-decoration:none; font-size:14px;\">Planos<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1.6 1 260px; min-width:240px;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:1.5px; color:#B7793E; margin-bottom:18px;\">COMPLIANCE<\u002Fdiv>\n        <p style=\"font-size:12.5px; line-height:1.65; color:#6E7C7A; margin:0;\">Página informativa, conforme o Código de Ética da OAB e o Provimento 205/2021. Nenhuma promessa de resultado, captação ou menção a honorários. A remuneração ofertada é sempre por produto e serviço — nunca por cliente ou percentual de honorário.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this.initSpotlight();\n    this.initRadarTip();\n    this.initProgress();\n    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    const reveals = document.querySelectorAll('[data-reveal]');\n    const counters = document.querySelectorAll('[data-count]');\n\n    if (reduce) {\n      reveals.forEach(function (el) { el.style.opacity = 1; el.style.transform = 'none'; });\n      counters.forEach(function (el) {\n        el.textContent = (el.dataset.prefix || '') + el.dataset.count + (el.dataset.suffix || '');\n      });\n      return;\n    }\n\n    // Scroll-based reveal — reliable across all rendering contexts.\n    const self = this;\n    const pending = Array.prototype.slice.call(reveals);\n    const pendingCount = Array.prototype.slice.call(counters);\n    let ticking = false;\n\n    const sweep = function () {\n      ticking = false;\n      const vh = window.innerHeight || document.documentElement.clientHeight;\n      for (let i = pending.length - 1; i >= 0; i--) {\n        const el = pending[i];\n        const top = el.getBoundingClientRect().top;\n        if (top < vh * 0.92) {\n          el.style.opacity = 1;\n          el.style.transform = 'none';\n          pending.splice(i, 1);\n        }\n      }\n      for (let j = pendingCount.length - 1; j >= 0; j--) {\n        const c = pendingCount[j];\n        const top = c.getBoundingClientRect().top;\n        if (top < vh * 0.85) {\n          self.runCount(c);\n          pendingCount.splice(j, 1);\n        }\n      }\n    };\n    const onScroll = function () {\n      if (!ticking) { ticking = true; requestAnimationFrame(sweep); }\n    };\n    window.addEventListener('scroll', onScroll, { passive: true });\n    window.addEventListener('resize', onScroll, { passive: true });\n    // initial passes (cover late layout/font shifts)\n    sweep();\n    requestAnimationFrame(sweep);\n    setTimeout(sweep, 300);\n\n    this.initRadar();\n  }\n\n  renderVals() {\n    return {\n      toggleFaq: function (e) {\n        const item = e.currentTarget.closest('[data-faq]');\n        if (!item) return;\n        const ans = item.querySelector('[data-faq-a]');\n        const open = ans.style.gridTemplateRows === '1fr';\n        document.querySelectorAll('[data-faq]').forEach(function (other) {\n          const oa = other.querySelector('[data-faq-a]');\n          const oi = other.querySelector('[data-faq-icon]');\n          if (oa) oa.style.gridTemplateRows = '0fr';\n          if (oi) oi.style.transform = 'none';\n          other.style.borderColor = '#24383A';\n        });\n        if (!open) {\n          ans.style.gridTemplateRows = '1fr';\n          const icon = item.querySelector('[data-faq-icon]');\n          if (icon) icon.style.transform = 'rotate(45deg)';\n          item.style.borderColor = '#B7793E';\n        }\n      }\n    };\n  }\n\n  initRadar() {\n    const panels = document.querySelectorAll('[data-radar-panel]');\n    const HL = 'rgba(95,183,167,0.10)';\n    panels.forEach(function (panel, pIdx) {\n      const rows = panel.querySelectorAll('[data-radar-row]');\n      if (!rows.length) return;\n      rows.forEach(function (r) {\n        r.style.transition = (r.style.transition || '') + ', background-color .7s ease, box-shadow .7s ease';\n        r.style.boxShadow = 'inset 2px 0 0 rgba(95,183,167,0)';\n      });\n      let i = 0;\n      const step = function () {\n        rows.forEach(function (r) {\n          r.style.backgroundColor = 'transparent';\n          r.style.boxShadow = 'inset 2px 0 0 rgba(95,183,167,0)';\n        });\n        const cur = rows[i % rows.length];\n        cur.style.backgroundColor = HL;\n        cur.style.boxShadow = 'inset 2px 0 0 rgba(95,183,167,0.85)';\n        i++;\n      };\n      setTimeout(function () { step(); setInterval(step, 2400); }, pIdx * 1200);\n    });\n  }\n\n  initProgress() {\n    const bar = document.querySelector('[data-progress]');\n    if (!bar) return;\n    let ticking = false;\n    const update = function () {\n      const h = document.documentElement.scrollHeight - window.innerHeight;\n      const p = h > 0 ? Math.min(window.scrollY / h, 1) : 0;\n      bar.style.width = (p * 100) + '%';\n      ticking = false;\n    };\n    window.addEventListener('scroll', function () {\n      if (!ticking) { ticking = true; requestAnimationFrame(update); }\n    }, { passive: true });\n    update();\n  }\n\n  initSpotlight() {\n    const cards = document.querySelectorAll('[data-spotlight]');\n    cards.forEach(function (card) {\n      card.style.position = card.style.position || 'relative';\n      const glow = document.createElement('div');\n      glow.setAttribute('aria-hidden', 'true');\n      glow.style.cssText = 'position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:0; transition:opacity .3s ease; background:radial-gradient(220px circle at 50% 50%, rgba(214,176,106,0.10), rgba(214,176,106,0) 60%); z-index:0;';\n      card.insertBefore(glow, card.firstChild);\n      Array.prototype.forEach.call(card.children, function (c) {\n        if (c !== glow && getComputedStyle(c).position === 'static') c.style.position = 'relative';\n      });\n      card.addEventListener('mousemove', function (e) {\n        const r = card.getBoundingClientRect();\n        glow.style.background = 'radial-gradient(220px circle at ' + (e.clientX - r.left) + 'px ' + (e.clientY - r.top) + 'px, rgba(214,176,106,0.12), rgba(214,176,106,0) 60%)';\n        glow.style.opacity = 1;\n      });\n      card.addEventListener('mouseleave', function () { glow.style.opacity = 0; });\n    });\n  }\n\n  initRadarTip() {\n    const tip = document.querySelector('[data-radar-tip]');\n    const blips = document.querySelectorAll('[data-radar-blip]');\n    if (!tip || !blips.length) return;\n    blips.forEach(function (b) {\n      b.addEventListener('mouseenter', function () {\n        tip.innerHTML = '<div style=\"font-size:13px; color:#F0ECE3; margin-bottom:3px;\">' + b.dataset.title + '<\u002Fdiv>'\n          + '<div style=\"display:flex; justify-content:space-between; gap:12px; align-items:baseline;\">'\n          + '<span style=\"font-family:\\'IBM Plex Mono\\',monospace; font-size:10px; color:#9BA7A3;\">' + b.dataset.meta + '<\u002Fspan>'\n          + '<span style=\"font-family:\\'Playfair Display\\',serif; font-size:15px; color:#D6B06A;\">' + b.dataset.value + '<\u002Fspan><\u002Fdiv>';\n        tip.style.left = b.style.left;\n        tip.style.top = b.style.top;\n        tip.style.opacity = 1;\n        tip.style.transform = 'translate(-50%,-128%)';\n      });\n      b.addEventListener('mouseleave', function () {\n        tip.style.opacity = 0;\n        tip.style.transform = 'translate(-50%,-120%)';\n      });\n    });\n  }\n\n  runCount(el) {\n    const target = parseInt(el.dataset.count, 10);\n    const prefix = el.dataset.prefix || '';\n    const suffix = el.dataset.suffix || '';\n    const dur = 1500;\n    const start = performance.now();\n    const tick = function (now) {\n      const t = Math.min((now - start) / dur, 1);\n      const eased = 1 - Math.pow(1 - t, 3);\n      el.textContent = prefix + Math.round(eased * target) + suffix;\n      if (t < 1) requestAnimationFrame(tick);\n    };\n    requestAnimationFrame(tick);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
